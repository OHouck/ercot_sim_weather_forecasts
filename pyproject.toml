[project]
name = "synthetic-ercot"
version = "0.1.0"
description = "Synthetic ERCOT power grid simulation project"
requires-python = ">=3.11"
dependencies = [
    "gurobipy>=13.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyomo>=6.9.5",
    "pypower>=5.1.19",
    "requests>=2.32.5",
    "scipy>=1.17.0",
    "tqdm>=4.67.3",
    "xarray>=2024.1.0",
    "cfgrib>=0.9.10",
    "netcdf4>=1.6.0",
    "geopandas>=1.1.2",
    "cartopy>=0.25.0",
    "openpyxl>=3.1.0",
    "pyfixest>=0.40.0",
    "numba>=0.64.0",
    "formulaic>=1.2.1",
    "joblib>=1.5.3",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "scikit-learn>=1.4.0",
    "cdsapi>=0.7.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "ecmwf-api-client>=1.6.3",
    "cftime>=1.6.5",
    "rasterio>=1.4.4",
    "pyarrow>=15.0.0",
    "great-tables>=0.21.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "neuraloperator>=0.3.0",
    "captum>=0.7.0",
    "binsreg>=2.1.7",
    "lightgbm>=4.6.0",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.3",
    "plotly>=6.7.0",
    "xeofs>=3.0.4",
    "sparse-pls>=0.1.3",
    "fpls>=0.2.0",
    "scikit-fda>=0.10.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]
